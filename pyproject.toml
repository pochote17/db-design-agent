[project]
name = "db-design-agent"
version = "0.1.0"
description = "AI agent for database schema design from business context"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13",
    "python-dotenv>=1.0",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
groq = ["langchain-groq>=0.1"]
openai = ["langchain-openai>=0.1"]
anthropic = ["langchain-anthropic>=0.1"]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3"]
all = ["db-design-agent[groq,openai,anthropic,dev]"]

[project.scripts]
db-design-agent = "db_agent.cli:app"

[project.urls]
Homepage = "https://github.com/user/db-design-agent"
Repository = "https://github.com/user/db-design-agent"
Issues = "https://github.com/user/db-design-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["E501", "TRY003", "I001", "F811", "F821", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "B008", "F841", "ARG001", "E", "F", "B", "PL", "SIM102", "SIM117"]
fixable = ["ALL"]
unfixable = []
exclude = [".git", ".venv", "dist", "build", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/db_agent"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
]